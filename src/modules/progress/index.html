<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAcademy</title>

  <!-- Global Styles & Fonts -->
  <link rel="stylesheet" href="/src/styles/main.css" />

  <link rel="shortcut icon" href="/src/assets/images/icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="main">
    <!-- Navbar -->
    <div data-include="/src/components/navbar.html"></div>

    <!-- Profile Box -->
    <div data-include="/src/components/profilebox.html"></div>

    <!-- Profile Tracker Section -->
    <div class="section-profile-tracker">
        <div class="left-profile-tracker">

            <div class="section-profile">
                <div class="profile-heading">
                    <h2 class="">Profile Tracker</h2>
                    <p class="">Register your platforms username to get platform specific progress.</p>
                </div>
                <form class="form">
                    <div class="gfg-div name-div">
                        <label for="gfgUsername" class="">GeeksforGeeks</label>
                        <div class="relative" data-placeholder="https://www.geeksforgeeks.org/user/">
                            <input type="text" id="gfgUsername" class="gfg-input-field" placeholder="username">
                        </div>
                    </div>
                    <div class="leetcode-div email-div">
                        <label for="leetCodeUsername" class="">LeetCode</label>
                        <div class="relative" data-placeholder="https://leetcode.com/u/">
                            <input type="text" id="leetCodeUsername" class="leetcode-input-field"
                                placeholder="username" name="name" value="">
                        </div>
                    </div>
                    
                    
                    
                    
                    <div class="submit-div button" id="fetchDataButton">
                        <!-- <button type="submit" class="">Submit</button> -->
                        <h4><a href="#" class="nav_login_button">Submit</a></h4>
                    </div>
                </form>
                
                <div id="moving-circle"></div>
            </div>

            <div id="totalProgress">
                <h2>Total Progress</h2>
                <div id="totalProgressData"></div>
            </div>

        </div>
        
        <div class="section-tracker">
            <!-- <div id="container"> -->
                <div id="gfgOutput">
                    <h2>GeeksforGeeks Data</h2>
                    <div id="gfgData"></div>
                </div>
                <div id="leetCodeOutput">
                    <h2>LeetCode Data</h2>
                    <div id="leetCodeData"></div>
                </div>
                
                
            <!-- </div> -->
        </div>
    </div>

    <section class="section-5"></section>
  </div>

  <!-- Footer -->
  <div data-include="/src/components/footer.html"></div>

  <!-- Auth Forms (Signin / Signup) -->
  <div data-include="/src/components/auth-forms.html"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script type="module" src="/src/scripts/main.js"></script>
  <script type="module" src="/src/modules/progress/script.js"></script>
  <!-- <script src="./src/scripts/includeLoader.js"></script> This will auto-load include tags -->
  <script>
    
    document.querySelectorAll('[data-include]').forEach(el => {
    fetch(el.getAttribute('data-include'))
        .then(res => res.text())
        .then(data => el.innerHTML = data);
    });
    
  </script>
  
</body>
</html>
