      <div class="editor-header">
        <h2 class="editor-title" id="editorTitle">Interactive Code Editor</h2>
        <div class="editor-controls">
          <button id="saveCode" class="btn btn-outline auth-required hidden">Save Code</button>
          <button id="loadCode" class="btn btn-outline auth-required hidden">Load Saved</button>
          <span id="saveStatus" class="save-status"></span>
        </div>
      </div>
      
      <div class="editor-wrapper" id="editorWrapper">
        <div class="editor-toolbar">
          <select id="languageSelect" class="toolbar-select">
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="java">Java</option>
            <option value="javascript" selected>JavaScript</option>
            <option value="python">Python</option>
          </select>
          <button class="toolbar-item" id="formatCode">Format Code</button>
          <button class="toolbar-item" id="clearCode">Clear</button>
          <button id="fullscreenBtn" class="fullscreen-btn"></button>
        </div>
        <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
      </div>
      
      <div class="input-section">
        <div class="input-header">
          <h3>Custom Input</h3>
          <button id="clearInput" class="toolbar-item">Clear</button>
        </div>
        <textarea id="customInput" class="custom-input" placeholder="Enter your input here..."></textarea>
      </div>
      
      <div class="execute-controls">
        <div>
          <button id="runCode" class="btn btn-primary btn-run">Run Code</button>
        </div>
        <div class="auth-required hidden">
          <span class="save-status" id="autoSaveStatus"></span>
        </div>
      </div>
      
      <div class="output-section">
        <div class="output-header">
          <h3>Output</h3>
          <span class="output-clear" id="clearOutput">Clear output</span>
        </div>
        <div id="outputContent" class="output-content"></div>
      </div>
    </div>
  </main>
