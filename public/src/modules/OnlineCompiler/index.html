<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAcademy</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <link rel="shortcut icon" href="/public/src/assets/images/icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/public/src/modules/OnlineCompiler/styles.css">
  <link rel="stylesheet" href="/public/src/modules/OnlineCompiler/editor.css">
  <link rel="stylesheet" href="/public/src/styles/main.css" />

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div id="main">
    <!-- Navbar -->
    <div data-include="/public/src/components/navbar.html"></div>

    <!-- Profile Box -->
    <div data-include="/public/src/components/profilebox.html"></div>

    <!-- Editor Section -->
    <main class="editor-container">
      <div class="container editor-content">
        <!-- <div id="problem-description" class="problem-description hidden">
          <div class="problem-header">
            <div class="problem-title">
              <h3 id="problem-title">Problem Title</h3>
              <span id="problem-difficulty" class="difficulty-tag difficulty-easy">Easy</span>
            </div>
          </div>
          <div class="problem-body" id="problem-body">
            Problem description will be dynamically loaded here
          </div>
          <div class="problem-examples">
            <div class="example">
              <h4>Example Input:</h4>
              <pre id="example-input"></pre>
            </div>
            <div class="example">
              <h4>Expected Output:</h4>
              <pre id="example-output"></pre>
            </div>
          </div>
        </div> -->
        
        <div class="editor-header">
          <h2 class="editor-title" id="editorTitle">Interactive Code Editor</h2>
          <div class="editor-controls">
            <button id="saveCode" class="btn btn-outline auth-required hidden">Save Code</button>
            <button id="loadCode" class="btn btn-outline auth-required hidden">Load Saved</button>
            <span id="saveStatus" class="save-status"></span>
          </div>
        </div>
        
        <div class="editor-wrapper" id="editorWrapper">
          <div class="editor-toolbar">
            <select id="languageSelect" class="toolbar-select">
              <option value="c">C</option>
              <option value="cpp">C++</option>
              <option value="java">Java</option>
              <option value="javascript" selected>JavaScript</option>
              <option value="python">Python</option>
            </select>
            <button class="toolbar-item" id="formatCode">Format Code</button>
            <button class="toolbar-item" id="clearCode">Clear</button>
            <button id="fullscreenBtn" class="fullscreen-btn"></button>
          </div>
          <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
        </div>
        
        <div class="input-section">
          <div class="input-header">
            <h3>Custom Input</h3>
            <button id="clearInput" class="toolbar-item">Clear</button>
          </div>
          <textarea id="customInput" class="custom-input" placeholder="Enter your input here..."></textarea>
        </div>
        
        <!-- <div class="execute-controls"> -->
          <div>
            <button id="runCode" class="btn btn-primary btn-run ">Run Code</button>
          </div>
          <!-- <div class="button">
            <h4 id="runCode" class="btn btn-primary "><a href="#">Run Code</a></h4>
          </div> -->
          <div class="auth-required hidden">
            <span class="save-status" id="autoSaveStatus"></span>
          </div>
        <!-- </div> -->
        
        <div class="output-section">
          <div class="output-header">
            <h3>Output</h3>
            <span class="output-clear" id="clearOutput">Clear Output</span>
          </div>
        <div id="outputContent" class="output-content"></div>
      </div>

      </div>
    </main>

    <section class="section-5"></section>

  </div>
  <!-- Footer -->
  <div data-include="/public/src/components/footer.html"></div>

  <!-- Auth Forms (Signin / Signup) -->
  <div data-include="/public/src/components/auth-forms.html"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script type="module" src="/public/src/scripts/main.js"></script>

  <script type="module" src="editor.js"></script>
  <script type="module" src="judge0.js"></script>
  <script>
    document.querySelectorAll('[data-include]').forEach(el => {
    fetch(el.getAttribute('data-include'))
        .then(res => res.text())
        .then(data => el.innerHTML = data);
    });
    
  </script>

</body>
</html>
