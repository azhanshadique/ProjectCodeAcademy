<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>CodeAcademy</title>

  <!-- Global Styles & Fonts -->
  <link rel="stylesheet" href="../../styles/main.css" />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
</head>
<body>

  <div id="main">

    <!-- Navbar -->
    <div data-include="../../components/navbar.html"></div>

    <!-- Profile Box -->
    <div data-include="../../components/profilebox.html"></div>

    <!-- Article Section -->
    <div class="article-container">
      <h1 id="article-title">Loading...</h1>
      <div id="article-box"></div>
    </div>
    

    <!-- <section class="section-5"></section> -->
  </div>


  <!-- Auth Forms (Signin / Signup) -->
  <div data-include="../../components/auth-forms.html"></div>

  <script>
    const title = localStorage.getItem("articleTitle");
    const content = localStorage.getItem("generatedArticle");

    document.getElementById("article-title").textContent = title || "Untitled Article";

    const articleBox = document.getElementById("article-box");

    function streamMarkdown(html, delay = 120) {
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = html;

      const elements = Array.from(tempDiv.childNodes).filter(node => node.nodeType === 1); // Only element nodes

      let index = 0;

      function showNext() {
        if (index >= elements.length) return;

        const el = elements[index];
        const clone = el.cloneNode(true);
        clone.classList.add("chunk");
        articleBox.appendChild(clone);

        // Force reflow to trigger animation
        void clone.offsetWidth;
        clone.classList.add("visible");

        index++;
        setTimeout(showNext, delay);
      }

      showNext();
    }

    if (content) {
      const html = marked.parse(content);
      streamMarkdown(html, 120); // 120ms delay per block
    } else {
      articleBox.textContent = "No article content found.";
    }
  </script>
  
    <!-- Firebase START-->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Firebase END-->
