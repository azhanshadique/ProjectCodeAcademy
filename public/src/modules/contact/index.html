<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAcademy</title>

  <!-- Global Styles & Fonts -->
  <link rel="stylesheet" href="/public/src/styles/main.css" />
  <!-- <link rel="stylesheet" href="./style.css" /> -->


  <link rel="shortcut icon" href="/src/assets/images/icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="main">
    <!-- Navbar -->
    <div data-include="/src/components/navbar.html"></div>

    <!-- Profile Box -->
    <div data-include="/src/components/profilebox.html"></div>

    <!-- Contact Section -->
    <div class="section-contact">
        <div class="contact-heading">
            <h2 class="">Contact Us</h2>
            <p class="">We value your feedback and are here to assist you. Please use the form below to drop your reviews, suggestions, or to ask for support.</p>
        </div>
        <form class="form">
            <div class="name-div">
                <label for="name" class="">Name</label>
                <div class="relative">
                    <input type="text" id="name" class=""
                        placeholder="Enter your name" name="name" value="">
                </div>
            </div>
            <div class="email-div">
                <label for="email" class="">Email address<!-- --> </label>
                <div class="relative">
                    <input type="email" id="contact-email" class="" placeholder="Enter email address" name="contact-email" value="">
                </div>
            </div>
            <div class="subject-div">
                <label for="subject" class="">Subject<!-- --> </label>
                <div class="relative">
                    <input type="text" id="subject" class="" placeholder="Enter subject" name="subject" value="">
                </div>
            </div>
            <div class="message-div">
                <label for="message" class="">Message</label>
                <textarea
                    id="message" name="message" rows="4"
                    class="">
                </textarea>
            </div>
            <div class="submit-div button">
                <!-- <button type="submit" class="">Submit</button> -->
                <h4><a href="#" class="nav_login_button">Submit</a></h4>
            </div>
        </form>
        
        <div id="moving-circle"></div>
    </div>

    <section class="section-5"></section>
  </div>

  <!-- Footer -->
  <div data-include="/src/components/footer.html"></div>

  <!-- Auth Forms (Signin / Signup) -->
  <div data-include="/src/components/auth-forms.html"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script type="module" src="/src/scripts/main.js"></script>
  <script>
    
    document.querySelectorAll('[data-include]').forEach(el => {
    fetch(el.getAttribute('data-include'))
        .then(res => res.text())
        .then(data => el.innerHTML = data);
    });
    
  </script>
  
</body>
</html>
